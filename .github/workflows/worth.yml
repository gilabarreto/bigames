name: Update net worth
on:
  schedule: [{ cron: '0 12 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Forbes real-time billionaires list (undocumented, no key); finalWorth is in millions USD
      - run: |
          curl -sf -A "Mozilla/5.0" "https://www.forbes.com/forbesapi/person/rtb/0/position/true.json?fields=finalWorth,uri&limit=3000" \
            | jq '[.personList.personsLists[] | select(.uri == ("bill-gates","elon-musk","mark-zuckerberg","donald-trump")) | {(.uri): (.finalWorth | round)}] | add' > worth.json.tmp
          jq -e 'length == 4' worth.json.tmp && mv worth.json.tmp worth.json
      - run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add worth.json && git diff --cached --quiet || (git commit -m "Update net worth" && git push)
